name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          ./gradlew :core-chess:test :core-ai:test \
            :core-data:testDebugUnitTest :feature-game:testDebugUnitTest \
            :feature-quests:testDebugUnitTest :feature-profile:testDebugUnitTest \
            :feature-online:testDebugUnitTest :app:testDebugUnitTest \
            :app:assembleDebug :app:compileDebugAndroidTestKotlin \
            --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: cheshers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
